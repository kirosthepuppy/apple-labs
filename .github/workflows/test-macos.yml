name: Test on macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            arch: arm64
          - os: macos-15-intel    # Intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BS: ./roblox-bootstrapper
    defaults:
      run:
        shell: /bin/bash -euxo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - name: Environment
        run: |
          sw_vers
          uname -m
          /bin/bash --version | head -1
          swiftc --version
          head -1 roblox-bootstrapper

      - name: Configure
        run: |
          # Saved to the config file so the launcher app (started by macOS,
          # without this job's environment) uses the same location.
          $BS config set INSTALL_DIR "$GITHUB_WORKSPACE/apps"
          $BS config show | grep -q "INSTALL_DIR=$GITHUB_WORKSPACE/apps"

      - name: Status (before install)
        run: |
          $BS status | tee status.txt
          grep -q "Architecture   ${{ matrix.arch }}" status.txt
          grep -q "Installed      no" status.txt
          $BS status --json | tee status.json
          osascript -l JavaScript -e 'function run(a) { var s = JSON.parse(a[0]); if (s.installed !== null || !s.latest) throw new Error("bad status"); return "ok"; }' "$(cat status.json)"

      - name: FastFlags via osascript
        run: |
          $BS fflags set DFIntTaskSchedulerTargetFps 240
          $BS fflags set FFlagDebugGraphicsPreferMetal true
          $BS fflags set FStringTest -5x
          $BS fflags list | tee flags.txt
          grep -qx 'DFIntTaskSchedulerTargetFps = 240' flags.txt
          grep -qx 'FFlagDebugGraphicsPreferMetal = true' flags.txt
          grep -qx 'FStringTest = "-5x"' flags.txt
          $BS fflags unset FStringTest
          echo '{"FIntTest": 7}' > import.json
          $BS fflags import import.json
          echo '{bad' > bad.json
          if $BS fflags import bad.json; then echo "bad JSON was accepted"; exit 1; fi
          $BS fflags list

      - name: Install
        run: |
          $BS install
          APP="$GITHUB_WORKSPACE/apps/Roblox.app"
          test -x "$APP/Contents/MacOS/RobloxPlayer"
          lipo -archs "$APP/Contents/MacOS/RobloxPlayer"
          lipo -archs "$APP/Contents/MacOS/RobloxPlayer" | grep -q "${{ matrix.arch }}"
          # Writing ClientSettings breaks the bundle's resource seal by design;
          # just check it is still signed; the Launch step proves it runs.
          codesign -dvv "$APP" 2>&1 | grep -q "^Authority="
          spctl --assess --type execute -v "$APP" || true
          cat "$APP/Contents/MacOS/ClientSettings/ClientAppSettings.json"
          grep -q '"DFIntTaskSchedulerTargetFps": 240' "$APP/Contents/MacOS/ClientSettings/ClientAppSettings.json"
          ! grep -q FStringTest "$APP/Contents/MacOS/ClientSettings/ClientAppSettings.json"

      - name: Install again is a no-op
        run: |
          $BS install | tee again.txt
          grep -q "up to date" again.txt
          $BS status

      - name: Mods
        run: |
          RES="$GITHUB_WORKSPACE/apps/Roblox.app/Contents/Resources"
          MODS="$($BS mods path)"
          orig_sound="$(md5 -q "$RES/content/sounds/ouch.ogg")"
          orig_font="$(md5 -q "$RES/content/fonts/families/Arimo.json")"
          mkdir -p "$MODS/content/sounds" "$MODS/content/fonts"
          cp "$RES/content/sounds/oof.ogg" "$MODS/content/sounds/ouch.ogg"
          cp /System/Library/Fonts/Supplemental/Arial.ttf "$MODS/content/fonts/CustomFont.ttf"
          $BS mods apply
          cmp "$RES/content/sounds/ouch.ogg" "$RES/content/sounds/oof.ogg"
          test -f "$RES/content/fonts/CustomFont.ttf"
          ! grep '"assetId"' "$RES/content/fonts/families/Arimo.json" | grep -v CustomFont.ttf
          $BS mods list
          # Removing mods restores Roblox's own files.
          $BS mods clear
          [ "$(md5 -q "$RES/content/sounds/ouch.ogg")" = "$orig_sound" ]
          [ "$(md5 -q "$RES/content/fonts/families/Arimo.json")" = "$orig_font" ]
          test ! -f "$RES/content/fonts/CustomFont.ttf"
          # Mods survive a reinstall.
          mkdir -p "$MODS/content/sounds"
          cp "$RES/content/sounds/oof.ogg" "$MODS/content/sounds/ouch.ogg"
          $BS install --force
          cmp "$RES/content/sounds/ouch.ogg" "$RES/content/sounds/oof.ogg"
          $BS mods clear

      - name: Accounts
        env:
          # Fake sign-in files, so the test never touches a real session.
          ROBLOX_COOKIES_FILE: ${{ runner.temp }}/cookies.binarycookies
          ROBLOX_APP_STORAGE_FILE: ${{ runner.temp }}/appStorage.json
        run: |
          T="$RUNNER_TEMP"
          ACC="$HOME/Library/Application Support/RobloxBootstrapper/Accounts"
          signin() {
            printf 'jar .ROBLOSECURITY for %s\n' "$1" > "$T/cookies.binarycookies"
            sleep 1.1
            printf '{"UserId":"%s","Username":"%s","DisplayName":"%s"}' "$2" "$1" "$3" > "$T/appStorage.json"
          }
          $BS accounts list > accounts.txt
          grep -q "No saved accounts" accounts.txt
          signin alpha 111 Alpha
          $BS accounts save
          # Adding signs Roblox out locally; the new sign-in is saved when Roblox quits.
          $BS accounts add
          test ! -f "$T/cookies.binarycookies"
          signin beta 222 Beta
          $BS accounts save --auto
          $BS accounts list | tee accounts.txt
          grep -q "Alpha (@alpha)" accounts.txt
          grep -q "Beta (@beta)" accounts.txt
          $BS accounts use alpha
          grep -q "for alpha" "$T/cookies.binarycookies"
          $BS accounts list --json > accounts.json
          python3 -c 'import json; d = json.load(open("accounts.json")); assert d["current"]["username"] == "alpha"; assert [a["active"] for a in d["accounts"]] == [True, False]'
          $BS accounts use Beta
          grep -q "for beta" "$T/cookies.binarycookies"
          # A removed account isn't brought back by the automatic save.
          $BS accounts remove beta
          signin gamma 333 Gamma
          $BS accounts save --auto
          $BS accounts list > accounts.txt
          ! grep -q "gamma" accounts.txt
          ! grep -q "Beta" accounts.txt
          if $BS accounts use '../x'; then echo "path-like name accepted"; exit 1; fi
          [ "$(stat -f %Lp "$ACC")" = 700 ]
          [ "$(stat -f %Lp "$ACC/111/cookies.binarycookies")" = 600 ]

      - name: Launch
        run: |
          $BS launch
          for i in $(seq 1 30); do pgrep -x RobloxPlayer && break; sleep 1; done
          pgrep -x RobloxPlayer
          pkill -x RobloxPlayer || true
          sleep 3

      - name: Build the launcher app
        run: |
          app/build.sh --zip
          APP="app/build/Roblox Bootstrapper.app"
          lipo -archs "$APP/Contents/MacOS/RobloxBootstrapper" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/RobloxBootstrapper" | grep -q x86_64
          codesign --verify --strict "$APP"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          cmp "$APP/Contents/Resources/roblox-bootstrapper" roblox-bootstrapper
          test -f app/build/Roblox-Bootstrapper.zip

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: Roblox-Bootstrapper
          path: app/build/Roblox-Bootstrapper.zip

      - name: Register the launcher app
        run: |
          mkdir -p "$HOME/Applications"
          ditto "app/build/Roblox Bootstrapper.app" "$HOME/Applications/Roblox Bootstrapper.app"
          icon_before="$(md5 -q "$HOME/Applications/Roblox Bootstrapper.app/Contents/Resources/AppIcon.icns")"
          $BS register
          test -x "$HOME/Applications/Roblox Bootstrapper.app/Contents/MacOS/RobloxBootstrapper"
          # The launcher keeps its own icon (only the applet borrows Roblox's).
          [ "$(md5 -q "$HOME/Applications/Roblox Bootstrapper.app/Contents/Resources/AppIcon.icns")" = "$icon_before" ]
          handler() {
            osascript -l JavaScript -e 'ObjC.import("CoreServices"); function run(a) { return ObjC.unwrap(ObjC.castRefToObject($.LSCopyDefaultHandlerForURLScheme($(a[0])))); }' "$1"
          }
          handler roblox-player
          [ "$(handler roblox-player)" = "com.robloxbootstrapper.handler" ]
          [ "$(handler roblox)" = "com.robloxbootstrapper.handler" ]
          $BS status | grep -q "Link handler   registered"

      - name: Open a roblox:// link through the launcher app
        run: |
          LOG="$HOME/Library/Application Support/RobloxBootstrapper/bootstrapper.log"
          before=$(grep -c "launch url" "$LOG" || true)
          open "roblox://experiences/start?placeId=1818"
          for i in $(seq 1 60); do
            after=$(grep -c "launch url" "$LOG" || true)
            [ "$after" -gt "$before" ] && break
            sleep 1
          done
          tail -20 "$LOG"
          [ "$after" -gt "$before" ]
          for i in $(seq 1 30); do pgrep -x RobloxPlayer && break; sleep 1; done
          pkill -x RobloxPlayer || true
          # The launcher quits by itself after handing the link to Roblox.
          for i in $(seq 1 20); do pgrep -f "Roblox Bootstrapper.app/Contents/MacOS" || break; sleep 1; done
          ! pgrep -f "Roblox Bootstrapper.app/Contents/MacOS"
          sleep 3

      - name: Applet fallback
        run: |
          $BS unregister
          # The launcher app is kept; only link handling is handed back.
          test -d "$HOME/Applications/Roblox Bootstrapper.app"
          rm -rf "$HOME/Applications/Roblox Bootstrapper.app"
          $BS register --applet
          test -f "$HOME/Applications/Roblox Bootstrapper.app/Contents/MacOS/applet"
          $BS unregister
          test ! -d "$HOME/Applications/Roblox Bootstrapper.app"

      - name: Uninstall
        run: |
          $BS register --applet
          $BS uninstall --purge
          test ! -d "$HOME/Applications/Roblox Bootstrapper.app"
          test ! -d "$GITHUB_WORKSPACE/apps/Roblox.app"

      - name: Log
        if: always()
        run: cat "$HOME/Library/Application Support/RobloxBootstrapper/bootstrapper.log" || true

  release:
    # Publish the launcher so `roblox-bootstrapper register` can download it.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Roblox-Bootstrapper
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^VERSION="\(.*\)"/\1/p' roblox-bootstrapper)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Roblox-Bootstrapper.zip --clobber
          else
            gh release create "$tag" Roblox-Bootstrapper.zip --target "$GITHUB_SHA" \
              --title "Roblox Bootstrapper $version" \
              --notes "Launcher app for macOS (Apple silicon and Intel). Install it with \`roblox-bootstrapper register\`, or unzip it into ~/Applications."
          fi
